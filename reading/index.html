.00L125.00 72.50L127.08 72.55ZM313.88 134.40L312.08 135.73L309.97 137.81L308.08 140.29L306.39 143.19L304.93 146.51L303.70 150.28L303.46 151.31L325.50 183.50L314.50 183.50L314.50 188.00L358.50 188.00L358.50 183.50L347.50 183.50ZM291.20 144.54L290.61 143.19L289.04 140.49L264.21 183.50L251.21 183.50L251.21 188.00L280.71 188.00L280.71 183.50L268.71 183.50Z"/></svg></a>
    <ol class="pips" aria-label="Reading progress">
      <li class="pip" data-label="Past">I</li>
      <li class="pip" data-label="Present">II</li>
      <li class="pip" data-label="Future">III</li>
    </ol>
    <button id="sound-toggle" type="button" class="sound-toggle" aria-pressed="false" aria-label="Background music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/>
        <path class="waves" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/>
        <path class="mute" d="M16 10l4 4M20 10l-4 4"/>
      </svg>
    </button>
  </header>

  <main class="reading-page">
    <div class="glow" aria-hidden="true"></div>

    <!-- I. The question: one idea on the screen -->
    <form id="ask-form" class="ask-form" novalidate>
      <header class="reading-head">
        <p class="eyebrow sc">The reading</p>
        <h1 class="headline">Ask, and the cards <em>will answer.</em></h1>
      </header>

      <div class="question-box">
        <label for="question" class="subtitle sc">What weighs on you?</label>
        <textarea id="question" name="question" rows="2"
                  placeholder="Name your question, or simply draw…"></textarea>
      </div>

      <div class="prompt-chips" role="group" aria-label="Suggested questions">
        <span class="prompt-chips-label sc">Or begin from the index</span>
        <button type="button" class="prompt-chip">What should I focus on this week?</button>
        <button type="button" class="prompt-chip">What's shifting in my love life?</button>
        <button type="button" class="prompt-chip">Where is my career heading?</button>
        <button type="button" class="prompt-chip">What do I need to release?</button>
        <button type="button" class="prompt-chip">What am I not seeing clearly?</button>
      </div>

      <button id="draw-btn" type="submit" class="btn">Draw your spread</button>
    </form>

    <!-- II. Choosing and turning: on wide screens, a two-page spread -->
    <section id="stage" class="stage" hidden>
      <div class="stage-plate">
        <div class="card-fan" role="group" aria-label="Pick a card"></div>
      </div>
      <div class="stage-text">
        <p class="stage-question" aria-live="polite"></p>
        <p class="tap-hint sc">Choose the card that pulls at you</p>
        <p class="stage-position"></p>
        <div class="stage-meaning" aria-live="polite" hidden></div>
        <button type="button" class="stage-next btn" hidden></button>
      </div>
    </section>

    <!-- III. The keeping: the reading, bound as an edition -->
    <section class="conclusion-zone" hidden>
      <header class="edition-head">
        <p class="eyebrow sc">Your reading</p>
        <h2 class="edition-title"></h2>
      </header>
      <div class="mini-cards"></div>
      <div class="ornament" aria-hidden="true"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z"/></svg></div>
      <div id="reading" class="reading"></div>
      <p class="edition-colophon sc"></p>
      <div class="conclusion-actions">
        <button id="share-btn" type="button" class="share-btn btn">Keep this reading</button>
        <button id="retry-btn" type="button" class="retry-btn textlink">Ask the cards again</button>
      </div>
      <aside class="invitation">
        <p class="eyebrow sc">At the table</p>
        <p class="invitation-text">Some questions deserve an hour, not three minutes. Private readings by candlelight are opening soon.</p>
        <a class="textlink" href="./#table">Reserve a seat</a>
      </aside>
    </section>
  </main>

  <script type="module" src="reading.js"></script>
</body>
</html>
